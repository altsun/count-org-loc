name: run
on:
  push:
    branches: [master]
  pull_request: {}
  workflow_dispatch:
    inputs:
      org_or_user:
        description: 'The org (or user) to calculate total lines of code'
        required: true
        type: string
permissions:
  contents: read
jobs:
  run:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: 4.0

      - name: script/bootstrap
        run: script/bootstrap

      - name: rubocop
        run: bundle exec rubocop

      - name: test
        run: bundle exec ruby -e 'Dir.glob("test/*_test.rb").each { |f| require File.expand_path(f) }'

      - name: count workflow dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          COUNT_OWNER: ${{ inputs.org_or_user }}
          GITHUB_TOKEN: ${{ secrets.ORG_GITHUB_TOKEN || github.token }}
        run: |
          : "${COUNT_OWNER:?Enter a GitHub organization or username}"
          bundle exec ruby loc.rb "$COUNT_OWNER"

      - name: default count
        if: github.event_name != 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: script/count balter-test-org
